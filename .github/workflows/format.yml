name: Format

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install --yes clang-format
      - name: Check formatting
        shell: bash
        run: |
          find include src tests \( -name '*.cpp' -o -name '*.hpp' \) -print0 | \
            xargs -0 clang-format --dry-run --Werror --style=file

minimum_pre_commit_version: "4.4.0"
default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format -i --style=file
        language: unsupported
        files: '\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$'
        stages: [pre-commit]
